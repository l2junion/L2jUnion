<html>
<head>
<title>L2jUnion</title>
</head>
<body>
<center>

<!-- Título -->
<table width=260 bgcolor=222222 cellpadding=6 cellspacing=0 border=0>
<tr><td align=center><font color="LEVEL" size=4><b>🛡 Panel del Jugador</b></font></td></tr>
</table>
<br>

<!-- Información del Jugador -->
<table width=260 cellpadding=4 cellspacing=1 bgcolor=444444 border=0>
<tr>
<td width=45 align=center bgcolor=333333 rowspan=2>
<img src="icon.skill4416" width=32 height=32>
</td>
<td bgcolor=2E2E2E align=left>
<font color="00FF00" size=3><b>%playername%</b></font>
</td>
</tr>
<tr>
<td bgcolor=2E2E2E align=left>
<font color="FF9900"><b>%online%</b></font> Online
</td>
</tr>
</table>
<br>

<!-- Opciones -->
<table width=260 cellpadding=2 cellspacing=1 bgcolor=444444 border=0>

<tr>
<td align=center bgcolor=333333>
<img src="icon.skill1001" width=28 height=28>
</td>
<td bgcolor=2E2E2E align=left>
<font color="00FF00"><b>Bloquear Exp/SP</b></font><br>
<font color="AAAAAA" size=1>Activa/Desactiva ganancia</font>
</td>
<td align=center bgcolor=2E2E2E>
<button action="bypass -h Panelxpon" value="ON" width=40 height=20 back="L2UI_ch3.bigbutton2_down" fore="L2UI_ch3.bigbutton2">
<button action="bypass -h Panelxpoff" value="OFF" width=40 height=20 back="L2UI_ch3.bigbutton2_down" fore="L2UI_ch3.bigbutton2">
</td>
</tr>

</table>
<br>

<!-- Botones -->
<table width=260 border=0 cellpadding=0 cellspacing=0>
<tr>
<td align=center>
<table width=120 height=26 border=0 cellpadding=0 cellspacing=0>
<tr>
<td align=center background="L2UI_ch3.bigbutton_down">
<button action="bypass -h panel_refresh" width=110 height=26 value="🔄 Actualizar" fore="L2UI_ch3.bigbutton">
</td>
</tr>
</table>
</td>
<td align=center>
<table width=120 height=26 border=0 cellpadding=0 cellspacing=0>
<tr>
<td align=center background="L2UI_ch3.bigbutton_down">
<button action="bypass -h panel_close" width=110 height=26 value="❌ Cerrar" fore="L2UI_ch3.bigbutton">
</td>
</tr>
</table>
</td>
</tr>
</table>

</center>
</body>
</html>
