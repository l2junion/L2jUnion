#=============================================================
#                     Kill Mob For Hero (KMFH)
#=============================================================
# Activar o desactivar el sistema
KMFHEnable = False

# Lista de NPCs/Monstruos, identificados por su ID y separados por coma, que darán el estado de Héroe a quien los mate
KMFHNpcIDs = 21000

# Probabilidad (en %) de obtener el estado de héroe al matar al objetivo
KMFHChance = 100

# Entregar la "Corona de Héroe" - Wings of Destiny Circlet (6842)
KMFHGiveHeroCirclet = true

# Duración en minutos del estado de héroe en el jugador
KMFHDurationInMinutes = 1440

# Intervalo de actualización en minutos entre las verificaciones de validez del estado de héroe (por defecto: 10)
KMFHTaskDelay = 10

# Ruta del archivo HTML que se enviará al jugador al GANAR el estado de héroe
# Dejar en blanco si no se desea mostrar
KMFHHTMLFileOnEnable = data/html/KMFH_on.htm

# Ruta del archivo HTML que se enviará al jugador al PERDER el estado de héroe
# Dejar en blanco si no se desea mostrar
KMFHHTMLFileOnDisable = data/html/KMFH_off.htm


